name: Build EasyCode Android APK

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test, lint and build with Gradle
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easycode-test-reports
          path: app/build/reports/tests/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easycode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Device Tests APK
        uses: actions/upload-artifact@v4
        with:
          name: easycode-device-tests-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
  device:
    name: Editor smoke test
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easycode-debug-apk
          path: device-apks/app
      - uses: actions/download-artifact@v4
        with:
          name: easycode-device-tests-apk
          path: device-apks/test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb install device-apks/app/*.apk
            adb install device-apks/test/*.apk
            adb shell am instrument -w com.easycode.ide.debug.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb pull /sdcard/Android/data/com.easycode.ide.debug/files/review review || true
            grep -q '^OK (' instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easycode-device-report
          path: |
            instrumentation.txt
            review/
