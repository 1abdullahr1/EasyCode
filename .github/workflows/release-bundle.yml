name: Build signed EasyCode Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle wrapper to run
        run: chmod +x gradlew

      - name: Prepare protected upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing PLAY_UPLOAD_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing PLAY_UPLOAD_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing PLAY_UPLOAD_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing PLAY_UPLOAD_KEY_PASSWORD repository secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easycode-upload.jks"
          echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/easycode-upload.jks" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PLAY_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify and build release bundle
        run: ./gradlew testReleaseUnitTest lintRelease bundleRelease --stacktrace

      - name: Upload signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: easycode-play-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
